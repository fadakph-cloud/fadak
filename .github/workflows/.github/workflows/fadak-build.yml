name: ساخت فایل نصبی
on:
  push: { tags: ['v*'] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/make_icon.py
      - name: دریافت فونت وزیرمتن
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip -OutFile v.zip
          Expand-Archive v.zip vz; Copy-Item "vz\fonts\ttf\Vazirmatn-Regular.ttf" assets\fonts\ -ErrorAction SilentlyContinue
      - name: دریافت مدل‌های حذف پس‌زمینه
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/models | Out-Null
          foreach ($m in "isnet-general-use","u2netp") { Invoke-WebRequest "https://github.com/danielgatis/rembg/releases/download/v0.0.0/$m.onnx" -OutFile "assets/models/$m.onnx" }
      - run: pyinstaller --noconfirm --windowed --name FadakPrintTool --icon assets/icon.ico --add-data "assets;assets" --collect-data cv2 --collect-all rembg --collect-all pymatting --collect-all onnxruntime --collect-submodules numba --hidden-import PyQt6.QtSvg --exclude-module tkinter main.py
      - name: دریافت زبان فارسی نصب‌کننده
        shell: pwsh
        run: Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Farsi.isl -OutFile installer/Farsi.isl
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - uses: actions/upload-artifact@v4
        with: { name: FadakPrintTool-Setup, path: installer/Output/*.exe }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: installer/Output/*.exe }
